name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Offline tests (with pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ragtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ragtest"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ragtest
      REQUIRE_DB_TESTS: "1"          # a skipped database test fails the build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Tests use fake models (conftest stubs sentence_transformers), so skip
      # the multi-GB torch download.
      - name: Install dependencies
        run: |
          grep -v -i '^sentence-transformers' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -rs