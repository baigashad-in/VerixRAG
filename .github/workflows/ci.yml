name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:                 # run by hand from the Actions tab

jobs:
  tests:
    name: Offline tests (with pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ragtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ragtest"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ragtest
      REQUIRE_DB_TESTS: "1"          # a skipped database test fails the build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # Tests use fake models (conftest stubs sentence_transformers), so skip
      # the multi-GB torch download.
      - name: Install dependencies
        run: |
          grep -v -i '^sentence-transformers' requirements.txt > "$RUNNER_TEMP/requirements-ci.txt"
          pip install -r "$RUNNER_TEMP/requirements-ci.txt" -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q -rs
  quality:
    name: Retrieval quality gate (BEIR SciFact)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      RERANK_CANDIDATES: "16"        # same as the app's
      RERANK_MAX_LENGTH: "256"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # Models, the SciFact download and its passage vectors; the vectors make
      # later runs skip the 5,183-passage embedding step.
      - name: Restore models, dataset and passage vectors
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            experiments/beir
          key: quality-scifact-minilm-v1

      - name: Install dependencies (CPU torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Benchmark SciFact (app rerank settings)
        run: >-
          python -m scripts.beir_benchmark --dataset scifact
          --rerank-candidates 16 --rerank-max-lengths 256
          --embed-cache experiments/beir/vectors

      - name: Save models, dataset and passage vectors
        if: always() && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface
            experiments/beir
          key: quality-scifact-minilm-v1

      - name: Quality gate
        run: python -m scripts.quality_gate --suite scifact

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scifact-report
          path: experiments/beir_scifact_*.json